spring:
  datasource:
    url: jdbc:h2:file:./.local/demo;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=INTERVAL
    username: sa
    password: ""
  jpa:
    properties:
      hibernate.dialect: org.hibernate.dialect.H2Dialect
server:
  address: 127.0.0.1
app:
  public-url: http://localhost:3000
  recovery:
    enabled: true
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
